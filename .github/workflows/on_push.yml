name: Example tests1

on:
  push:
    branches:
      - junit5

  pull_request:
    branches:
      - junit5

  workflow_dispatch:

env:
  QASE_TESTOPS_API_TOKEN: ${{ secrets.QASE_API_TOKEN }}
  QASE_TESTOPS_PROJECT: ${{ vars.QASE_TESTOPS_PROJECT }}
  QASE_TESTOPS_RUN_COMPLETE: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Get run title
        id: set_title
        run: |
          BRANCH_NAME=${GITHUB_REF##*/}
          COMMIT_MESSAGE=$(git log -1 --pretty=format:%s)
          echo "QASE_TESTOPS_RUN_TITLE=qase-junit5@$BRANCH_NAME: $COMMIT_MESSAGE" >> $GITHUB_ENV

      - name: Set up JDK 11
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install Dependencies
        run: ./gradlew build -x test  # Build the project, skip running tests for this step

      - name: Run Junit5 tests
        run: |
          QASE_MODE=testops ./gradlew test  # Run the tests using Gradle
